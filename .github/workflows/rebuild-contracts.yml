name: Beta rebuild contracts
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/rebuild-contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/rebuild-contracts.yml'
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Beta
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify extracted module is synchronized
        run: node scripts/build.mjs --check
      - name: Verify single-file build is reproducible
        run: node scripts/build.mjs && git diff --exit-code -- index.html
      - name: Run source-contract tests
        run: node --test tests/*.test.mjs
