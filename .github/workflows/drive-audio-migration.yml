name: Temporary Drive audio migration
on:
  push:
    branches:
      - main
    paths:
      - .github/audio-migration-mode
      - .github/scripts/migrate_drive_audio.py
      - .github/workflows/drive-audio-migration.yml
permissions:
  contents: read
concurrency:
  group: beta-drive-audio-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Check out Beta
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Transfer selected public Drive MP3s to GitHub Releases
        env:
          GH_TOKEN: \${{ github.token }}
        run: python3 .github/scripts/migrate_drive_audio.py .github/audio-migration-mode
