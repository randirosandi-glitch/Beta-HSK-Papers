name: Temporary Drive audio migration
on:
  push:
    branches:
      - main
    paths:
      - .github/audio-migration-mode
      - .github/scripts/migrate_drive_audio.py
      - .github/workflows/drive-audio-migration.yml
permissions:
  contents: read
concurrency:
  group: beta-drive-audio-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Check out Beta
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Transfer selected public Drive MP3s to GitHub Releases
        id: migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/migrate_drive_audio.py .github/audio-migration-mode
      - name: Set up Node.js for browser playback test
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium for browser playback test
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium
      - name: Verify Release playback and seeking
        env:
          AUDIO_CODES: ${{ steps.migration.outputs.codes }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/test_release_audio.mjs
